apiVersion: batch/v1
kind: Job
metadata:
  name: perf-analyzer-job
  namespace: supersonic-f03
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: perf-analyzer
        image: nvcr.io/nvidia/tritonserver:22.07-py3-sdk
        command: ["/bin/bash"]
        args:
          - "-c"
          - |
            echo "Running perf_analyzer..."
            perf_analyzer -i grpc \
                          -m higgsInteractionNet \
                          -u supersonic-f03.supersonic-f03.svc.cluster.local:8001 \
                          --async -p 1 -b 100  --measurement-interval=5000 \
                          --concurrency-range=1:1 --input-data "random"