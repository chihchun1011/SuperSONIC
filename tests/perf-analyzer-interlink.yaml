apiVersion: batch/v1
kind: Job
metadata:
  name: perf-analyzer-job
  namespace: supersonic-interlink
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: perf-analyzer
        image: nvcr.io/nvidia/tritonserver:22.07-py3-sdk
        command: ["/bin/bash"]
        args:
          - "-c"
          - |
            echo "=== Checking Triton health ===" && \
            curl -sf http://supersonic-interlink-triton.supersonic-interlink.svc.cluster.local:8000/v2/health/ready && \
            echo "Triton is ready" || echo "Triton not ready!" && \
            echo "=== Available models ===" && \
            curl -sf http://supersonic-interlink-triton.supersonic-interlink.svc.cluster.local:8000/v2/models/stats | python3 -m json.tool && \
            echo "=== Running perf_analyzer ===" && \
            perf_analyzer -i grpc \
              -m higgsInteractionNet \
              -u supersonic-interlink-triton.supersonic-interlink.svc.cluster.local:8001 \
              --async -p 1 -b 100 \
              --measurement-interval=1000 \
              --concurrency-range=1:4 \
              --input-data "random" && \
            echo "=== GPU metrics ===" && \
            curl -sf http://supersonic-interlink-triton.supersonic-interlink.svc.cluster.local:8000/v2/models/higgsInteractionNet/stats | python3 -m json.tool