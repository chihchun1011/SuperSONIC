triton:
  replicas: 1
  image: fastml/triton-torchgeo:22.07-py3-geometric # works for CMSSW run3
  command: ["/bin/sh", "-c"]
  args: 
    - |
      /opt/tritonserver/bin/tritonserver \
      --model-repository=/cvmfs/cms.cern.ch/el9_amd64_gcc12/cms/cmssw/CMSSW_14_1_0_pre7/external/el9_amd64_gcc12/data/RecoBTag/Combined/data/models/ \
      --log-verbose=0 \
      --strict-model-config=false \
      --disable-auto-complete-config \
      --exit-timeout-secs=60
  resources:
    limits: { cpu: 2, memory: 8G, nvidia.com/gpu: 1}
    requests: { cpu: 2, memory: 8G, nvidia.com/gpu: 1}
  modelRepository:
    enabled: true
    storageType: cvmfs-pvc
    mountPath: /cvmfs
  readinessProbe:
    reset: true

envoy:
  enabled: true
  
keda:
  enabled: false

prometheus:
  enabled: true
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
  serviceAccounts:
    server:
      name: supersonic-f03-prometheus-sa
  server:
    useExistingClusterRoleName: supersonic-f03-prometheus-role

grafana:
  enabled: true
  dashboardsConfigMaps:
    default: supersonic-f03-grafana-default-dashboard
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
  datasources:
    datasources.yaml:
      datasources:
        - name: prometheus
          type: prometheus
          access: proxy
          isDefault: true
          url: http://supersonic-f03-prometheus-server:9090
          jsonData:
            timeInterval: "5s"
            tlsSkipVerify: true

opentelemetry-collector:
  enabled: true
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"

tempo:
  enabled: true
  tempo:
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"

metricsCollector:
  enabled: true